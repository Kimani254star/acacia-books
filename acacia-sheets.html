<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Acacia Sheets</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="acaciabooks-logo.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f3f4f8;color:#1f2340}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#312e81;color:#fff;flex-wrap:wrap}
.top img{height:28px}.top b{font-size:17px}.top a.back{margin-left:auto;color:#c7d2fe;text-decoration:none;font-size:14px}
.top input.title{background:#4338ca;border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:15px;min-width:200px}
button,.btn{cursor:pointer;border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;background:#6d28d9;color:#fff}
button:hover,.btn:hover{background:#7c3aed}button.g{background:#e5e7f5;color:#1f2340}button.g:hover{background:#d4d7ee}button.d{background:#dc2626}
.bar{display:flex;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid #dcdff0;flex-wrap:wrap;align-items:center}
select{padding:6px;border-radius:8px;border:1px solid #c9cde6}
.side{width:230px;background:#fff;border-right:1px solid #dcdff0;overflow:auto;padding:10px}
.side .it{padding:8px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.side .it:hover,.side .it.on{background:#eef0ff}
.wrap{display:flex;height:calc(100vh - 100px)}.main{flex:1;overflow:auto}
@media(max-width:700px){.side{width:130px}}
</style></head><body>
<div class="top"><img src="acaciabooks-logo.png" alt=""><b>Acacia Sheets</b><input id="title" class="title" placeholder="Untitled spreadsheet"><a class="back" href="index.html">← Back to Acacia Books</a></div>

<div class="bar"><button class="g" onclick="newSheet()">＋ New</button>
<label class="btn">⬆ Open Excel / CSV<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="importX(this.files[0])"></label>
<button onclick="exportX('xlsx')">⬇ Download Excel (.xlsx)</button><button class="g" onclick="exportX('csv')">⬇ CSV</button><button class="d" onclick="delSheet()">🗑</button>
<span style="font-size:12px;color:#6b7099">Formulas: =A1+B1, =SUM(A1:A9), AVERAGE, MIN, MAX, COUNT, ROUND, IF</span><span id="st" style="font-size:12px;color:#6b7099;margin-left:auto"></span></div>
<div class="wrap"><div class="side" id="list"></div><div class="main"><table id="g" style="border-collapse:collapse;font-size:13px;background:#fff"></table></div></div>
<style>#g td,#g th{border:1px solid #d5d8ec;padding:0}#g th{background:#eef0ff;font-weight:600;padding:4px 8px;position:sticky;top:0;z-index:1;font-size:12px}
#g th.r{left:0;z-index:2;position:sticky}#g input{width:100px;border:0;padding:5px 6px;font-size:13px;background:transparent;outline:0}#g input:focus{outline:2px solid #6d28d9;background:#faf7ff}</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
var K="acaciaSheets",COLS=26,ROWS=100,sheets=JSON.parse(localStorage.getItem(K)||"[]"),cur=null,$=function(i){return document.getElementById(i)};
function cn(i){return String.fromCharCode(65+i)}
function save(){localStorage.setItem(K,JSON.stringify(sheets))}
function ev(ref,seen){var raw=cur.cells[ref];if(raw==null||raw==="")return 0;raw=String(raw);if(raw[0]!=="=")return isNaN(raw)||raw.trim()===""?raw:parseFloat(raw);
 if(seen[ref])return"#CYCLE";seen=Object.assign({},seen);seen[ref]=1;
 try{var e=raw.slice(1).toUpperCase().replace(/([A-Z]+\d+):([A-Z]+\d+)|([A-Z]+\d+)(?!\()/g,function(m,a,b,c){return a?'R("'+a+'","'+b+'")':'V("'+c+'")'});
  if(!/^[0-9A-Z_\s+\-*\/().,"%<>=!&|?:]*$/.test(e))return"#ERR";
  var V=function(r){var x=ev(r,seen);return typeof x==="string"&&x[0]==="#"?(function(){throw x})():x};
  var R=function(a,b){var m1=/([A-Z]+)(\d+)/.exec(a),m2=/([A-Z]+)(\d+)/.exec(b),o=[];for(var c=m1[1].charCodeAt(0);c<=m2[1].charCodeAt(0);c++)for(var r=+m1[2];r<=+m2[2];r++){var x=ev(String.fromCharCode(c)+r,seen);if(typeof x==="string"&&x[0]==="#")throw x;o.push(x)}return o};
  var F=function(a){return [].concat.apply([],a).filter(function(x){return typeof x==="number"})};
  var SUM=function(){return F(arguments).reduce(function(a,b){return a+b},0)},AVERAGE=function(){var f=F(arguments);return f.length?SUM(f)/f.length:0},MIN=function(){return Math.min.apply(null,F(arguments))},MAX=function(){return Math.max.apply(null,F(arguments))},COUNT=function(){return F(arguments).length},ROUND=function(a,b){var p=Math.pow(10,b||0);return Math.round(a*p)/p},ABS=Math.abs,IF=function(c,a,b){return c?a:b};
  var r=new Function("V","R","SUM","AVERAGE","MIN","MAX","COUNT","ROUND","ABS","IF",'return ('+e+')')(V,R,SUM,AVERAGE,MIN,MAX,COUNT,ROUND,ABS,IF);
  return typeof r==="number"?Math.round(r*1e10)/1e10:r}catch(x){return typeof x==="string"?x:"#ERR"}}
function build(){var h="<tr><th class='r'></th>";for(var c=0;c<COLS;c++)h+="<th>"+cn(c)+"</th>";h+="</tr>";
 for(var r=1;r<=ROWS;r++){h+="<tr><th class='r'>"+r+"</th>";for(c=0;c<COLS;c++)h+="<td><input id='"+cn(c)+r+"' data-r='"+cn(c)+r+"'></td>";h+="</tr>"}$("g").innerHTML=h}
function paint(skip){for(var r=1;r<=ROWS;r++)for(var c=0;c<COLS;c++){var k=cn(c)+r,el=$(k);if(k===skip)continue;var raw=cur.cells[k];el.value=raw==null||raw===""?"":(String(raw)[0]==="="?ev(k,{}):raw)}}
$("g")&&0;
document.addEventListener("focusin",function(e){var k=e.target.dataset&&e.target.dataset.r;if(k)e.target.value=cur.cells[k]==null?"":cur.cells[k]});
document.addEventListener("focusout",function(e){var k=e.target.dataset&&e.target.dataset.r;if(!k)return;var v=e.target.value;if(v==="")delete cur.cells[k];else cur.cells[k]=v;commit();paint()});
document.addEventListener("keydown",function(e){var k=e.target.dataset&&e.target.dataset.r;if(!k)return;var m=/([A-Z]+)(\d+)/.exec(k),c=m[1].charCodeAt(0)-65,r=+m[2],n=null;
 if(e.key==="Enter"||e.key==="ArrowDown")n=cn(c)+Math.min(ROWS,r+1);else if(e.key==="ArrowUp")n=cn(c)+Math.max(1,r-1);else if(e.key==="Tab"&&!e.shiftKey){n=cn(Math.min(COLS-1,c+1))+r}
 if(n){e.preventDefault();$(n).focus()}});
function commit(){cur.title=$("title").value;cur.t=Date.now();save();$("st").textContent="Saved "+new Date().toLocaleTimeString();renderList()}
$("title").addEventListener("input",commit);
function renderList(){$("list").innerHTML=sheets.map(function(d){return '<div class="it'+(d===cur?' on':'')+'" onclick="openS('+d.id+')">📊 '+(d.title||"Untitled spreadsheet").replace(/</g,"&lt;")+'</div>'}).join("")}
function show(){$("title").value=cur.title;paint();renderList()}
function newSheet(){cur={id:Date.now(),title:"",cells:{},t:Date.now()};sheets.unshift(cur);save();show()}
function openS(id){cur=sheets.filter(function(d){return d.id==id})[0];show()}
function delSheet(){if(!confirm("Delete this spreadsheet?"))return;sheets=sheets.filter(function(d){return d!==cur});save();if(sheets.length){cur=sheets[0];show()}else newSheet()}
function exportX(t){var ws={},maxC=0,maxR=0;Object.keys(cur.cells).forEach(function(k){var raw=cur.cells[k],m=/([A-Z]+)(\d+)/.exec(k),c=m[1].charCodeAt(0)-65,r=+m[2]-1;maxC=Math.max(maxC,c);maxR=Math.max(maxR,r);
  var a=XLSX.utils.encode_cell({c:c,r:r});raw=String(raw);if(raw[0]==="="){var v=ev(k,{});ws[a]={t:typeof v==="number"?"n":"s",v:v,f:raw.slice(1)}}else if(raw.trim()!==""&&!isNaN(raw))ws[a]={t:"n",v:parseFloat(raw)};else ws[a]={t:"s",v:raw}});
 ws["!ref"]=XLSX.utils.encode_range({s:{c:0,r:0},e:{c:maxC,r:maxR}});var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
 XLSX.writeFile(wb,(cur.title||"spreadsheet")+"."+t,{bookType:t})}
function importX(f){if(!f)return;var r=new FileReader();r.onload=function(){var wb=XLSX.read(r.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],cells={};
 Object.keys(ws).forEach(function(a){if(a[0]==="!")return;var p=XLSX.utils.decode_cell(a);if(p.c>=COLS||p.r>=ROWS)return;var x=ws[a];cells[cn(p.c)+(p.r+1)]=x.f?"="+x.f:(x.v==null?"":String(x.v))});
 cur={id:Date.now(),title:f.name.replace(/\.[^.]+$/,""),cells:cells,t:Date.now()};sheets.unshift(cur);save();show()};r.readAsArrayBuffer(f)}
build();if(!sheets.length)newSheet();else{cur=sheets[0];show()}
</script></body></html>
